[pytest]
testpaths = services/web-api/tests services/web-api/src
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    ee: Enterprise Edition tests (YH_EDITION=ee)
    saas: SaaS Edition tests (YH_EDITION=saas)
    ce: Community Edition tests (YH_EDITION=ce)
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
