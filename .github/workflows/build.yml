name: build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: CE build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: yh
          POSTGRES_USER: yh
          POSTGRES_DB: yh
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      YH_EDITION: ce
      # Steps 的 working-directory 是 services/web-api,相对路径会解析不到,必须绝对路径
      YH_CONFIG_FILE: ${{ github.workspace }}/services/web-api/config/yinghuo-ci.yaml
      # 仅 CI 用;Settings.JWT_SECRET 必填且 >= 32 字符
      YH_JWT_SECRET: ci-only-not-a-secret-0123456789abcdef012345

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web-app/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/web-app

      - name: Build frontend
        run: pnpm build
        working-directory: apps/web-app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
        working-directory: services/web-api

      - name: Verify backend assembles
        run: |
          python -c "from yinghuo_app.app import app; print('CE app loaded, routes:', len(app.routes))"
        working-directory: services/web-api

      - name: Run tests
        run: |
          cd "$GITHUB_WORKSPACE"
          pytest -m "not ee and not saas" services/web-api/tests

  ce-tarball:
    name: CE source tarball sanity
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Verify EE/SaaS code is excluded from CE tarball
        run: |
          set -e
          mkdir -p workdir
          git archive --format=tar HEAD | tar -x -C workdir
          rm -rf workdir/apps/web-app/ee \
                 workdir/apps/web-app/src/ee \
                 workdir/services/web-api/src/yinghuo_app/ee \
                 workdir/services/web-api/src/yinghuo_app/saas
          rm -f workdir/LICENSE.EE workdir/LICENSE.SAAS
          tar -czf ce-check.tar.gz -C workdir .
          LEAKS=$(tar tzf ce-check.tar.gz | grep -E "/ee/|/saas/|apps/web-app/ee/|src/ee/|yinghuo_app/ee/|yinghuo_app/saas/" || true)
          if [ -n "$LEAKS" ]; then
            echo "EE/SaaS leak detected:"; echo "$LEAKS"; exit 1
          fi
          if tar tzf ce-check.tar.gz | grep -qE "^LICENSE\.(EE|SAAS)$"; then
            echo "commercial LICENSE leaked into CE"; exit 1
          fi
          echo "CE tarball sanity OK"